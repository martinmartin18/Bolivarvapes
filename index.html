<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolivar Vapes | Catálogo</title>
    <style>
        body { background-color: #0f0f12; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .logo { width: 120px; border-radius: 50%; border: 2px solid #6c5ce7; box-shadow: 0 0 20px #6c5ce766; }
        h1 { background: linear-gradient(to right, #00d4ff, #a29bfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        .container { max-width: 500px; margin: auto; }
        .vape-card { 
            background: #1a1a22; border-radius: 15px; padding: 15px; margin-bottom: 20px; 
            border: 1px solid #333; transition: 0.3s; cursor: pointer; text-align: left;
        }
        .vape-card:hover { border-color: #00d4ff; background: #222; }
        .vape-img { width: 100%; display: none; border-radius: 10px; margin-bottom: 10px; }
        .vape-card:hover .vape-img { display: block; } /* Aquí aparece la foto al tocar/pasar mouse */
        .price { color: #25d366; font-size: 1.5rem; font-weight: bold; }
        .btn-wa { 
            display: block; background: #25d366; color: white; text-decoration: none; 
            padding: 15px; border-radius: 10px; font-weight: bold; margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" class="logo">
        <h1>Bolivar Vapes</h1>
        <p>San Carlos de Bolívar</p>

        <div class="vape-card">
            <img src="geekbar.jpg" class="vape-img"> <h3>GEEK BAR Z35</h3>
            <p>35.000 Puffs | Sabores: Grape Ice, Strawberry...</p>
            <span class="price">$28.000</span>
        </div>

        <a href="https://wa.me/542314483738" class="btn-wa">SOLICITAR ASESORAMIENTO</a>
    </div>
</body>
</html>
